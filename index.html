<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BudgetKu — Sistem Keuangan Ojol</title>
  <meta name="description" content="Sistem pencatatan keuangan ojek online dengan logika alokasi insentif yang cerdas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- AUTH PAGE -->
  <div id="auth-wrapper" class="auth-wrapper">
    <div class="auth-card">
      <div class="logo justify-center mb-24">
        <span class="logo-icon" style="font-size:2.5rem">🛵</span>
        <span class="logo-text" style="font-size:1.8rem">BudgetKu</span>
      </div>
      <div id="loginFormContainer">
        <h2 style="text-align:center;margin-bottom:20px">Masuk ke Akun</h2>
        <form id="formLogin">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="logUser" required />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="logPass" required />
          </div>
          <button type="submit" class="btn btn-primary btn-full mt-12">Login</button>
        </form>
        <div style="text-align:center;margin-top:20px;font-size:0.85rem">
          <span class="text-muted">Belum punya akun?</span> <a href="#" id="showRegister" class="text-primary fw-600" style="text-decoration:none">Daftar sekarang</a>
        </div>
      </div>

      <div id="registerFormContainer" style="display:none">
        <h2 style="text-align:center;margin-bottom:20px">Daftar Akun Baru</h2>
        <form id="formRegister">
          <div class="form-group">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" class="form-control" id="regName" required />
          </div>
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="regUser" required />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="regPass" required />
          </div>
          <button type="submit" class="btn btn-success btn-full mt-12">Daftar Akun</button>
        </form>
        <div style="text-align:center;margin-top:20px;font-size:0.85rem">
          <span class="text-muted">Sudah punya akun?</span> <a href="#" id="showLogin" class="text-primary fw-600" style="text-decoration:none">Masuk di sini</a>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APP WRAPPER -->
  <div id="app-wrapper" style="display:none;">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">🛵</span>
        <span class="logo-text">BudgetKu</span>
      </div>
      <button class="sidebar-close" id="sidebarClose">✕</button>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard" id="nav-dashboard">
        <span class="nav-icon">📊</span><span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="transaksi" id="nav-transaksi">
        <span class="nav-icon">📝</span><span>Input Transaksi</span>
      </a>
      <a href="#" class="nav-item" data-page="riwayat" id="nav-riwayat">
        <span class="nav-icon">📋</span><span>Riwayat Cashflow</span>
      </a>
      <a href="#" class="nav-item" data-page="servis" id="nav-servis">
        <span class="nav-icon">🔧</span><span>Riwayat Servis</span>
      </a>
      <a href="#" class="nav-item" data-page="pengeluaran" id="nav-pengeluaran">
        <span class="nav-icon">💸</span><span>Pengeluaran</span>
      </a>
      <a href="#" class="nav-item" data-page="utang" id="nav-utang">
        <span class="nav-icon">🏦</span><span>Utang</span>
      </a>
      <a href="#" class="nav-item" data-page="pengaturan" id="nav-pengaturan">
        <span class="nav-icon">⚙️</span><span>Pengaturan</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="current-date mb-16" id="currentDate"></div>
      <button class="btn btn-outline btn-full btn-sm" id="btnLogout" style="border-color:var(--danger);color:var(--danger)">🚪 Logout</button>
    </div>
  </aside>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay"></div>

  <!-- MAIN -->
  <main class="main" id="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="quickAddBtn">+ Transaksi</button>
      </div>
    </header>

    <!-- PAGES -->
    <div class="page active" id="page-dashboard">
      <!-- Dashboard content injected by JS -->
    </div>
    <div class="page" id="page-transaksi">
      <!-- Transaction form injected by JS -->
    </div>
    <div class="page" id="page-riwayat">
      <!-- Cashflow history injected by JS -->
    </div>
    <div class="page" id="page-servis">
      <!-- Service history injected by JS -->
    </div>
    <div class="page" id="page-pengeluaran">
      <!-- Expenses injected by JS -->
    </div>
    <div class="page" id="page-utang">
      <!-- Debt injected by JS -->
    </div>
    <div class="page" id="page-pengaturan">
      <!-- Settings injected by JS -->
    </div>
  </main>
  </div> <!-- END APP WRAPPER -->

  <!-- TOAST -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/db.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/transaksi.js"></script>
  <script src="js/pages/riwayat.js"></script>
  <script src="js/pages/servis.js"></script>
  <script src="js/pages/pengeluaran.js"></script>
  <script src="js/pages/utang.js"></script>
  <script src="js/pages/pengaturan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
