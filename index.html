<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BudgetKu — Sistem Keuangan Driver</title>
  <meta name="description" content="Sistem pencatatan keuangan driver online premium dengan alokasi servis cerdas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- AUTH PAGE -->
  <div id="auth-wrapper" class="auth-wrapper">
    <div class="auth-card">
      <div class="logo justify-center mb-24">
        <svg class="logo-icon-svg" viewBox="0 0 24 24" fill="none" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:2.5rem;height:2.5rem;margin-right:8px">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4f8ef7" />
              <stop offset="100%" stop-color="#a78bfa" />
            </linearGradient>
          </defs>
          <path d="M2 17h18a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H2" />
          <circle cx="6" cy="17" r="3" />
          <circle cx="16" cy="17" r="3" />
          <path d="M13 7l-2-4H8" />
        </svg>
        <span class="logo-text" style="font-size:1.8rem">BudgetKu</span>
      </div>
      <div id="loginFormContainer">
        <h2 style="text-align:center;margin-bottom:20px;font-family:'Outfit',sans-serif;font-weight:700">Masuk ke Akun</h2>
        <form id="formLogin">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="logUser" placeholder="contoh@email.com" required />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="logPass" required />
          </div>
          <button type="submit" class="btn btn-primary btn-full mt-12">Login</button>
        </form>
        <div style="text-align:center;margin-top:20px;font-size:0.85rem">
          <span class="text-muted">Belum punya akun?</span> <a href="#" id="showRegister" class="text-primary fw-600" style="text-decoration:none">Daftar sekarang</a>
        </div>
      </div>

      <div id="registerFormContainer" style="display:none">
        <h2 style="text-align:center;margin-bottom:20px;font-family:'Outfit',sans-serif;font-weight:700">Daftar Akun Baru</h2>
        <form id="formRegister">
          <div class="form-group">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" class="form-control" id="regName" required />
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="regUser" placeholder="contoh@email.com" required />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="regPass" required />
          </div>
          <button type="submit" class="btn btn-success btn-full mt-12">Daftar Akun</button>
        </form>
        <div style="text-align:center;margin-top:20px;font-size:0.85rem">
          <span class="text-muted">Sudah punya akun?</span> <a href="#" id="showLogin" class="text-primary fw-600" style="text-decoration:none">Masuk di sini</a>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APP WRAPPER -->
  <div id="app-wrapper" style="display:none;">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg class="logo-icon-svg" viewBox="0 0 24 24" fill="none" stroke="url(#logoGrad2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:2.2rem;height:2.2rem;margin-right:8px">
          <defs>
            <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4f8ef7" />
              <stop offset="100%" stop-color="#a78bfa" />
            </linearGradient>
          </defs>
          <path d="M2 17h18a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H2" />
          <circle cx="6" cy="17" r="3" />
          <circle cx="16" cy="17" r="3" />
          <path d="M13 7l-2-4H8" />
        </svg>
        <span class="logo-text">BudgetKu</span>
      </div>
      <button class="sidebar-close" id="sidebarClose">✕</button>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard" id="nav-dashboard">
        <span class="nav-icon">
          <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        </span>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="transaksi" id="nav-transaksi">
        <span class="nav-icon">
          <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </span>
        <span>Input Transaksi</span>
      </a>
      <a href="#" class="nav-item" data-page="riwayat" id="nav-riwayat">
        <span class="nav-icon">
          <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </span>
        <span>Riwayat Cashflow</span>
      </a>
      <a href="#" class="nav-item" data-page="servis" id="nav-servis">
        <span class="nav-icon">
          <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </span>
        <span>Riwayat Servis</span>
      </a>
      <a href="#" class="nav-item" data-page="pengeluaran" id="nav-pengeluaran">
        <span class="nav-icon">
          <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </span>
        <span>Pengeluaran</span>
      </a>
      <a href="#" class="nav-item" data-page="utang" id="nav-utang">
        <span class="nav-icon">
          <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        </span>
        <span>Utang</span>
      </a>
      <a href="#" class="nav-item" data-page="laporan" id="nav-laporan">
        <span class="nav-icon">
          <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </span>
        <span>Laporan</span>
      </a>
      <a href="#" class="nav-item" data-page="pengaturan" id="nav-pengaturan">
        <span class="nav-icon">
          <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </span>
        <span>Pengaturan</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sb-clock" id="sbClock">
        <div class="sb-clock-time">
          <span id="sbHH">00</span><span class="sb-colon" id="sbColon">:</span><span id="sbMM">00</span><span class="sb-colon">:</span><span id="sbSS">00</span>
        </div>
        <div class="sb-clock-date" id="sbDate"></div>
      </div>
      <div class="sidebar-sync-status" id="sidebarSyncStatus">
        <span class="sync-dot"></span>
        <span class="sync-text">Mengecek...</span>
      </div>
      <button class="btn btn-outline btn-full btn-sm" id="btnLogout" style="border-color:var(--danger);color:var(--danger)">
        <svg class="btn-icon-svg" style="width:14px;height:14px;vertical-align:middle;margin-right:6px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout
      </button>
    </div>
  </aside>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay"></div>

  <!-- MAIN -->
  <main class="main" id="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle Tema">
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="btn btn-primary btn-sm" id="quickAddBtn">
          <svg style="width:14px;height:14px;vertical-align:middle;margin-right:6px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Transaksi
        </button>
      </div>
    </header>

    <!-- PAGES -->
    <div class="page active" id="page-dashboard"></div>
    <div class="page" id="page-transaksi"></div>
    <div class="page" id="page-riwayat"></div>
    <div class="page" id="page-servis"></div>
    <div class="page" id="page-pengeluaran"></div>
    <div class="page" id="page-utang"></div>
    <div class="page" id="page-pengaturan"></div>
    <div class="page" id="page-laporan"></div>
  </main>
  </div> <!-- END APP WRAPPER -->

  <!-- TOAST -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SCRIPTS -->
  <script src="js/db.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/transaksi.js"></script>
  <script src="js/pages/riwayat.js"></script>
  <script src="js/pages/servis.js"></script>
  <script src="js/pages/pengeluaran.js"></script>
  <script src="js/pages/utang.js"></script>
  <script src="js/pages/pengaturan.js"></script>
  <script src="js/pages/laporan.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cursor.js"></script>
</body>
</html>
